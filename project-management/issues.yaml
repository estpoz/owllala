    state as the full Settings page.
  acceptance_criteria:
  - The modal can be opened from supported gameplay screens.
  - The modal displays the settings intended to be adjustable during gameplay.
  - Values match the full Settings page.
  - Changes update the shared settings source immediately.
  - Closing the modal returns the child to the same gameplay state.
  - Opening the modal pauses or blocks unintended gameplay interaction.
  - The modal cannot appear multiple times simultaneously.
  - Controls support accessible touch targets and readable labels.
  - The modal works in landscape orientation.
  - No separate or duplicated settings state is introduced.
