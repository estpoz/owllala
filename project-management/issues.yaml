repo: "estpoz/CVDApp"
project_title: "CVDApp"
default_status: "Backlog"
year: 2026

assignees:
  steven: "sevet15"
  stanley: "stanleyy30"
  farrell: "fsudjatmiko"
  amanda: "amandamich"
  heidy: "estpoz"

labels:
  - name: "design"
    color: "BFD4F2"
    description: "Visual design, assets, layout, storyboard, character, and scene work"
  - name: "frontend"
    color: "C2E0C6"
    description: "SwiftUI screen and UI implementation"
  - name: "logic"
    color: "F9D0C4"
    description: "Game rules, validation, scoring, progress tracking, and local storage"
  - name: "content"
    color: "FEF2C0"
    description: "Story text, instruction copy, feedback, dialogue, and wording"
  - name: "research"
    color: "D4C5F9"
    description: "Learning objective, cue validation, concept testing, and research alignment"
  - name: "testing"
    color: "FAD8C7"
    description: "Usability, QA, bug checking, and validation testing"
  - name: "accessibility"
    color: "FBCA04"
    description: "CVD-safe design, sufficient contrast, Dynamic Type, and color filter"
  - name: "profile"
    color: "D93F0B"
    description: "Profile View, progress tracking, cue strength graph, and parent-facing progress"
  - name: "gameplay"
    color: "0E8A16"
    description: "Mini-game mechanics, story gameplay, and replayable practice"

milestones:
  - title: "M1 — Concept + Foundation"
    due_date: "2026-07-10"
    description: "Concept testing, challenge response refinement, lo-fi prototype, technical setup, and project foundation."
  - title: "M2 — Core Mini-Games"
    due_date: "2026-07-14"
    description: "Core implementation of Chapter 1-4 mini-games with basic validation and scoring criteria."
  - title: "M3 — Full MVP Flow"
    due_date: "2026-07-17"
    description: "End-to-end Story 1 flow, final mission, scoring, profile, and practice playground integration."
  - title: "M4 — MVP Test Ready"
    due_date: "2026-07-21"
    description: "Bug fixing, accessibility checks, final dry run, and MVP preparation for usability testing."

project_fields:
  status:
    type: "single_select"
    options: ["Backlog", "In Progress", "Review", "Done"]
  start_date:
    type: "date"
  target_date:
    type: "date"
  priority:
    type: "single_select"
    options: ["High", "Medium", "Low"]
  role:
    type: "single_select"
    options: ["Design", "Frontend", "Logic", "Content", "Research", "Testing", "Accessibility", "Project Management"]
  pic_area:
    type: "single_select"
    options:
      - "Shape"
      - "Labels/Symbols/Text"
      - "Brightness/Contrast"
      - "Pattern/Texture"
      - "Story Flow"
      - "Feedback"
      - "Navigation"
      - "Scoring"
      - "Profile"
      - "Practice Playground"
      - "Color Filter"
      - "Larger Text"
      - "Sufficient Contrast"
      - "Assets"
      - "Testing"

issues:
  - id: "US1-01"
    title: "US1-01 — Design Story 1 chapter flow"
    assignee: "sevet15"
    labels: ["design", "content"]
    milestone: "M1 — Concept + Foundation"
    status: "Backlog"
    priority: "High"
    start_date: "2026-07-06"
    target_date: "2026-07-09"
    role: "Design"
    pic_area: "Story Flow"
    description: |
      Create the full chapter flow for Story 1: The Lost Lunchbox Mystery, from Chapter 1 to Chapter 5.
    acceptance_criteria:
      - "Need to define the story sequence from Chapter 1 to Chapter 5."
      - "Need to make each chapter feel connected to Mika finding her lunchbox."
      - "Need to define the cue focus and mini-game purpose for each chapter."
      - "Need to keep the story short and child-friendly."

  - id: "US1-02"
    title: "US1-02 — Create character and mascot dialogue guide"
    assignee: "sevet15"
    labels: ["design", "content"]
    milestone: "M1 — Concept + Foundation"
    status: "Backlog"
    priority: "High"
    start_date: "2026-07-06"
    target_date: "2026-07-10"
    role: "Content"
    pic_area: "Story Flow"
    description: |
      Define how Mika and Cluey communicate during the story, including guide dialogue, hints, encouragement, and celebration.
    acceptance_criteria:
      - "Need to define Mika's role as the child character in the story."
      - "Need to define Cluey's role as the visual clue guide."
      - "Need to create short dialogue for story intro, hints, retries, and success."
      - "Need to keep wording simple for children aged 5-12."

  - id: "US1-03"
    title: "US1-03 — Build Chapter 1 mini-game: Silhouette Match"
    assignee: "amandamich"
    labels: ["design", "frontend", "logic", "gameplay"]
    milestone: "M2 — Core Mini-Games"
    status: "Backlog"
    priority: "High"
    start_date: "2026-07-13"
    target_date: "2026-07-14"
    role: "Frontend"
    pic_area: "Shape"
    description: |
      Create the Chapter 1 mini-game where children identify Mika's lunchbox using shape.
    acceptance_criteria:
      - "Need to show a target silhouette or outline."
      - "Need to provide multiple object choices."
      - "Need to allow children to tap the matching object."
      - "Need to validate the answer based on shape, not color."
      - "Need to show feedback after the child selects an answer."
      - "Need to define scoring criteria for mini-game 1 star, 2 star, and 3 star."

  - id: "US1-04"
    title: "US1-04 — Build Chapter 2 mini-game: Match the Sign"
    assignee: "fsudjatmiko"
    labels: ["design", "frontend", "logic", "gameplay"]
    milestone: "M2 — Core Mini-Games"
    status: "Backlog"
    priority: "High"
    start_date: "2026-07-13"
    target_date: "2026-07-14"
    role: "Frontend"
    pic_area: "Labels/Symbols/Text"
    description: |
      Create the Chapter 2 mini-game where children match signs, labels, or symbols to the correct place.
    acceptance_criteria:
      - "Need to show clear signs, icons, or text labels."
      - "Need to allow tap-to-match or drag-and-drop interaction."
      - "Need to validate the answer based on symbol/label meaning."
      - "Need to make text and icons readable."
      - "Need to show feedback after the child selects an answer."
      - "Need to define scoring criteria for mini-game 1 star, 2 star, and 3 star."

  - id: "US1-05"
    title: "US1-05 — Build Chapter 3 mini-game: Find the Clear Object"
    assignee: "stanleyy30"
    labels: ["design", "frontend", "logic", "gameplay", "accessibility"]
    milestone: "M2 — Core Mini-Games"
    status: "Backlog"
    priority: "High"
    start_date: "2026-07-13"
    target_date: "2026-07-14"
    role: "Frontend"
    pic_area: "Brightness/Contrast"
    description: |
      Create the Chapter 3 mini-game where children identify an object using brightness and contrast.
    acceptance_criteria:
      - "Need to show objects with different visibility or contrast levels."
      - "Need to guide children to notice light and dark differences."
      - "Need to allow children to select the object with the clearest boundary."
      - "Need to avoid low-contrast red/green-dependent visuals."
      - "Need to show feedback after the child selects an answer."
      - "Need to define scoring criteria for mini-game 1 star, 2 star, and 3 star."

  - id: "US1-06"
    title: "US1-06 — Build Chapter 4 mini-game: Pattern Tracker"
    assignee: "estpoz"
    labels: ["design", "frontend", "logic", "gameplay", "accessibility"]
    milestone: "M2 — Core Mini-Games"
    status: "Backlog"
    priority: "High"
    start_date: "2026-07-13"
    target_date: "2026-07-14"
    role: "Frontend"
    pic_area: "Pattern/Texture"
    description: |
      Create the Chapter 4 mini-game where children identify the lunchbox using pattern or texture.
    acceptance_criteria:
      - "Need to show a target pattern or texture."
      - "Need to provide multiple object options with different patterns."
      - "Need to use patterns that are clear, simple, and distinguishable."
      - "Need to validate the answer based on pattern/texture, not color."
      - "Need to show feedback after the child selects an answer."
      - "Need to define scoring criteria for mini-game 1 star, 2 star, and 3 star."

  - id: "US1-07"
    title: "US1-07 — Build Chapter 5 final mission: Find Mika's Lunchbox"
    assignee: "stanleyy30"
    labels: ["design", "frontend", "logic", "gameplay"]
    milestone: "M3 — Full MVP Flow"
    status: "Backlog"
    priority: "High"
    start_date: "2026-07-16"
    target_date: "2026-07-17"
    role: "Frontend"
    pic_area: "Brightness/Contrast"
    description: |
      Create the final story mission where children use all visual cues together to find Mika's lunchbox in the cafeteria.
    acceptance_criteria:
      - "Need to include shape, sign, light/contrast, pattern/texture, and context clues."
      - "Need to present the challenge in a real-life cafeteria scene."
      - "Need to require children to use more than one clue to identify the correct lunchbox."
      - "Need to complete the story when the correct lunchbox is found."
      - "Need to show final celebration feedback."
      - "Need to define scoring criteria for mini-game 1 star, 2 star, and 3 star."

  - id: "US1-08"
    title: "US1-08 — Implement feedback and hint system"
    assignee: "fsudjatmiko"
    labels: ["frontend", "logic", "content"]
    milestone: "M3 — Full MVP Flow"
    status: "Backlog"
    priority: "High"
    start_date: "2026-07-10"
    target_date: "2026-07-17"
    role: "Frontend"
    pic_area: "Feedback"
    description: |
      Create immediate feedback and simple hints for correct and incorrect answers.
    acceptance_criteria:
      - "Need to show positive feedback when the child answers correctly."
      - "Need to show helpful retry feedback when the child answers incorrectly."
      - "Need to mention the visual cue being used in the feedback."
      - "Need to avoid discouraging wording."
      - "Need to allow Cluey to give simple hints when needed."

  - id: "US1-09"
    title: "US1-09 — Build chapter navigation and story progress"
    assignee: "amandamich"
    labels: ["frontend", "logic"]
    milestone: "M3 — Full MVP Flow"
    status: "Backlog"
    priority: "High"
    start_date: "2026-07-10"
    target_date: "2026-07-17"
    role: "Frontend"
    pic_area: "Navigation"
    description: |
      Implement chapter navigation and completion tracking for Story 1.
    acceptance_criteria:
      - "Need to unlock the next chapter after the current chapter is completed."
      - "Need to show current chapter progress."
      - "Need to prevent children from skipping directly to the final mission before completing earlier chapters."
      - "Need to save story progress locally."

  - id: "US2-01"
    title: "US2-01 — Define visual cue learning objectives and chapter mapping"
    assignee: "sevet15"
    labels: ["research", "content", "design"]
    milestone: "M1 — Concept + Foundation"
    status: "Backlog"
    priority: "High"
    start_date: "2026-07-06"
    target_date: "2026-07-09"
    role: "Research"
    pic_area: "Story Flow"
    description: |
      Define what each visual cue teaches and how it appears in Story 1.
    acceptance_criteria:
      - "Need to define the learning objective for shape."
      - "Need to define the learning objective for labels/symbols/text."
      - "Need to define the learning objective for brightness/contrast."
      - "Need to define the learning objective for pattern/texture."
      - "Need to define the learning objective for context in the final mission."
      - "Need to connect each cue objective to the correct chapter."

  - id: "US2-02"
    title: "US2-02 — Create everyday object and scene assets"
    assignee: "sevet15"
    labels: ["design", "accessibility"]
    milestone: "M2 — Core Mini-Games"
    status: "Backlog"
    priority: "High"
    start_date: "2026-07-10"
    target_date: "2026-07-16"
    role: "Design"
    pic_area: "Assets"
    description: |
      Prepare object and scene assets for Story 1.
    acceptance_criteria:
      - "Need to create distinguishable lunchbox and school object assets."
      - "Need to create sign, label, and icon assets."
      - "Need to create clear pattern and texture variations."
      - "Need to create classroom, hallway, locker, playground, and cafeteria scenes."
      - "Need to keep assets readable and not dependent on red/green differences."

  - id: "US2-03"
    title: "US2-03 — Implement non-color cue answer validation"
    assignee: "fsudjatmiko"
    labels: ["logic", "frontend", "gameplay"]
    milestone: "M3 — Full MVP Flow"
    status: "Backlog"
    priority: "High"
    start_date: "2026-07-13"
    target_date: "2026-07-17"
    role: "Logic"
    pic_area: "Navigation"
    description: |
      Implement answer validation based on the intended non-color cue for each mini-game. Each visual cue PIC should implement their own validation logic, while Farrell coordinates the shared structure.
    acceptance_criteria:
      - "Need to validate Chapter 1 answers based on shape."
      - "Need to validate Chapter 2 answers based on sign/label match."
      - "Need to validate Chapter 3 answers based on contrast/visibility target."
      - "Need to validate Chapter 4 answers based on pattern/texture match."
      - "Need to validate Chapter 5 answers using multiple cue requirements."

  - id: "US2-04"
    title: "US2-04 — Build Practice Playground with replayable cue games"
    assignee: "estpoz"
    labels: ["frontend", "logic", "gameplay"]
    milestone: "M3 — Full MVP Flow"
    status: "Backlog"
    priority: "Medium"
    start_date: "2026-07-16"
    target_date: "2026-07-20"
    role: "Frontend"
    pic_area: "Practice Playground"
    description: |
      Create a Practice Playground that unlocks after Story 1 is completed and allows children to replay cue mini-games.
    acceptance_criteria:
      - "Need to unlock Practice Playground only after Story 1 is completed."
      - "Need to show unlocked mini-games from completed chapters."
      - "Need to allow children to replay shape, sign, light/contrast, and pattern/texture games."
      - "Need to keep Practice Playground separate from Story Mode."

  - id: "US2-05"
    title: "US2-05 — Build Profile View for learning progress"
    assignee: "estpoz"
    labels: ["frontend", "logic", "design", "profile"]
    milestone: "M3 — Full MVP Flow"
    status: "Backlog"
    priority: "Medium"
    start_date: "2026-07-16"
    target_date: "2026-07-20"
    role: "Frontend"
    pic_area: "Profile"
    description: |
      Create a parent-facing Profile View that summarizes the child's progress and learning strength.
    acceptance_criteria:
      - "Need to show total stars collected."
      - "Need to show completed chapters or levels."
      - "Need to show learning strength for each visual cue."
      - "Need to visualize cue strength using a simple graph or radar chart."
      - "Need to make the view readable for parents."

  - id: "US2-06"
    title: "US2-06 — Implement cue scoring system"
    assignee: "estpoz"
    labels: ["logic", "profile"]
    milestone: "M3 — Full MVP Flow"
    status: "Backlog"
    priority: "High"
    start_date: "2026-07-10"
    target_date: "2026-07-16"
    role: "Logic"
    pic_area: "Scoring"
    description: |
      Create a simple scoring system that calculates learning strength for each cue based on child performance.
    acceptance_criteria:
      - "Need to track correct answers per visual cue."
      - "Need to track stars earned per visual cue."
      - "Need to update cue strength after each completed mini-game."
      - "Need to provide cue scores for the Profile View graph."
      - "Need to save cue scores locally."

  - id: "US2-07"
    title: "US2-07 — Add CVD-safe visual design rules"
    assignee: "stanleyy30"
    labels: ["design", "frontend", "accessibility"]
    milestone: "M1 — Concept + Foundation"
    status: "Backlog"
    priority: "High"
    start_date: "2026-07-06"
    target_date: "2026-07-10"
    role: "Accessibility"
    pic_area: "Sufficient Contrast"
    description: |
      Apply visual design rules so the app is usable for children with partial red-green CVD.
    acceptance_criteria:
      - "Need to use color as decoration, not as the only source of meaning."
      - "Need to pair color-coded elements with icons, text, shapes, or patterns."
      - "Need to maintain sufficient luminance contrast."
      - "Need to use clear and distinguishable patterns."
      - "Need to avoid red/green-dependent answer states."

  - id: "US2-08"
    title: "US2-08 — Implement in-app color blind filter mode"
    assignee: "fsudjatmiko"
    labels: ["frontend", "accessibility"]
    milestone: "M4 — MVP Test Ready"
    status: "Backlog"
    priority: "Medium"
    start_date: "2026-07-10"
    target_date: "2026-07-21"
    role: "Accessibility"
    pic_area: "Color Filter"
    description: |
      Add an in-app color blind filter or color-safe display mode for MVP demonstration.
    acceptance_criteria:
      - "Need to provide an in-app toggle for color blind filter mode."
      - "Need to apply the selected filter consistently across main app screens."
      - "Need to include at least red-green CVD relevant options, such as protan/deutan or a general red-green safe mode."
      - "Need to make sure the app still uses icons, labels, contrast, and patterns instead of relying on the filter alone."

  - id: "US2-09"
    title: "US2-09 — Support Dynamic Type / Larger Text"
    assignee: "amandamich"
    labels: ["frontend", "accessibility"]
    milestone: "M4 — MVP Test Ready"
    status: "Backlog"
    priority: "High"
    start_date: "2026-07-10"
    target_date: "2026-07-21"
    role: "Accessibility"
    pic_area: "Larger Text"
    description: |
      Implement text scaling support so key text can follow iPadOS Larger Text settings.
    acceptance_criteria:
      - "Need to use scalable SwiftUI text styles where possible."
      - "Need to avoid fixed text containers that cut off larger text."
      - "Need to support Dynamic Type for instructions, labels, buttons, and feedback text."
      - "Need to test main screens with larger text sizes."

  - id: "US2-10"
    title: "US2-10 — Check sufficient contrast across main screens"
    assignee: "stanleyy30"
    labels: ["design", "testing", "accessibility"]
    milestone: "M4 — MVP Test Ready"
    status: "Backlog"
    priority: "High"
    start_date: "2026-07-17"
    target_date: "2026-07-21"
    role: "Accessibility"
    pic_area: "Sufficient Contrast"
    description: |
      Review the app screens to ensure important text, buttons, objects, and interactive elements have sufficient contrast.
    acceptance_criteria:
      - "Need to check contrast for text and buttons."
      - "Need to check contrast between objects and backgrounds."
      - "Need to check contrast in story scenes and mini-game screens."
      - "Need to check contrast with color blind filter mode enabled."
      - "Need to revise visuals that fail contrast checks."

  - id: "US2-11"
    title: "US2-11 — Test cue recognition and accessibility"
    assignee: "estpoz"
    labels: ["testing", "research", "accessibility"]
    milestone: "M4 — MVP Test Ready"
    status: "Backlog"
    priority: "High"
    start_date: "2026-07-06"
    target_date: "2026-07-24"
    role: "Testing"
    pic_area: "Testing"
    description: |
      Test whether users can understand and complete the cue-based mini-games without relying on color. This issue covers concept testing on 6-7 July and usability testing on 23-24 July.
    acceptance_criteria:
      - "Need to test whether users understand each mini-game objective."
      - "Need to check whether correct answers can be identified without color alone."
      - "Need to collect notes on confusing visuals, unclear instructions, or low-contrast elements."
      - "Need to revise visuals or instructions based on testing feedback."
