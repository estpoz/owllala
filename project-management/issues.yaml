repo: estpoz/CVDApp
project_title: CVDApp
default_status: Backlog
year: 2026
assignees:
  steven: sevet15
  stanley: stanleyy30
  farrell: fsudjatmiko
  amanda: amandamich
  heidy: estpoz
milestones:
- title: M1 - Concept + Foundation
  due_date: '2026-07-10'
  description: Concept testing, challenge response refinement, lo-fi prototype, technical setup, and project foundation.
- title: M2 - Core Build Foundation
  due_date: '2026-07-15'
  description: Establish the development foundation and complete the first implementation cycle for the core learning
    experience, including project architecture, unit testing setup, Xcode Cloud and TestFlight automation, Chapter
    1-4 mini-games, shared assets, answer validation, and at least 50% of the core hi-fi wireflow.
- title: M3 - Integrated Working MVP
  due_date: '2026-07-21'
  description: Deliver a functional end-to-end MVP integrating Cerita Utama, Mode Berlatih, chapter progression,
    feedback, scoring, local progress, accessibility support, final hi-fi wireflow, and feature integration.
- title: M4 - Usability Validation + Final Delivery
  due_date: '2026-08-04'
  description: Validate the integrated MVP through accessibility checks and usability testing, synthesize findings,
    iterate the working MVP and final prototype, stabilize the final build, and prepare the presentation and app
    demonstration.
project_fields:
  status:
    type: single_select
    options:
    - Backlog
    - In Progress
    - Review
    - Done
  start_date:
    type: date
  target_date:
    type: date
  priority:
    type: single_select
    options:
    - High
    - Medium
    - Low
  role:
    type: single_select
    options:
    - Design
    - Frontend
    - Logic
    - Content
    - Research
    - Testing
    - Accessibility
    - Project Management
  pic_area:
    type: single_select
    options:
    - Shape
    - Labels/Symbols/Text
    - Brightness/Contrast
    - Pattern/Texture
    - Story Flow
    - Feedback
    - Navigation
    - Scoring
    - Profile
    - Practice Playground
    - Color Filter
    - Larger Text
    - Sufficient Contrast
    - Assets
    - Testing
